spring.application.name=recruitment-platform-backend
server.port=8080

# Database Configuration (MySQL 8.0)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/recruitment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sneha123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

# Application & Sandbox settings
app.sandbox.working-dir=${SANDBOX_DIR:compiler-sandbox}
app.sandbox.timeout-seconds=5

# Logging
logging.level.com.recruitment=INFO
logging.level.org.springframework.security=WARN

# AI Proctoring Python Microservice Integration
proctoring.ai.service-url=${PROCTORING_SERVICE_URL:http://localhost:8000}
proctoring.ai.api-key=${PROCTORING_SERVICE_API_KEY:default-proctoring-secret-key-2026}

